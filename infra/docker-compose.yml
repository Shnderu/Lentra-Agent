services:

  redis:
    image: redis:7-alpine
    container_name: lentra-redis
    ports:
      - "6379:6379"

  db:
    image: postgres:15
    container_name: lentra-db
    environment:
      POSTGRES_USER: lentra
      POSTGRES_PASSWORD: lentra
      POSTGRES_DB: lentra
    ports:
      - "5432:5432"

  api:
    build:
      context: /opt/lentra
      dockerfile: api/Dockerfile
    container_name: lentra-api
    ports:
      - "8000:8000"

  worker:
    build:
      context: /opt/lentra
      dockerfile: worker/Dockerfile
    container_name: lentra-worker

  bot:
    build:
      context: /opt/lentra
      dockerfile: bot/Dockerfile
    container_name: lentra-bot

  miniapp:
    build: /opt/lentra/miniapp
    container_name: lentra-miniapp
    ports:
      - "8080:80"
