services:
  lentra-api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    image: infra-api
    container_name: lentra-api
    ports:
      - "8000:8000"
    depends_on:
      - lentra-redis
      - lentra-db
    environment:
      - REDIS_HOST=lentra-redis
      - DB_HOST=postgres
    restart: unless-stopped

  lentra-worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    image: infra-worker
    container_name: lentra-worker
    depends_on:
      - lentra-redis
      - lentra-db
    environment:
      - REDIS_HOST=lentra-redis
    restart: unless-stopped

  lentra-worker-stream:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    image: infra-worker-stream
    container_name: lentra-worker-stream
    depends_on:
      - lentra-redis
    environment:
      - REDIS_HOST=lentra-redis
    command: python -u worker/worker_stream_v7.py
    restart: unless-stopped

  lentra-worker-retry:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    image: infra-worker-retry
    container_name: lentra-worker-retry
    depends_on:
      - lentra-redis
    environment:
      - REDIS_HOST=lentra-redis
    restart: unless-stopped

  lentra-bot:
    build:
      context: ..
      dockerfile: bot/Dockerfile
    image: infra-bot
    container_name: lentra-bot
    depends_on:
      - lentra-redis
    environment:
      - REDIS_HOST=lentra-redis
    restart: unless-stopped

  lentra-db:
    image: postgres:15
    container_name: lentra-db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: lentra
    restart: unless-stopped

  lentra-redis:
    image: redis:7-alpine
    container_name: lentra-redis
    restart: unless-stopped

  lentra-miniapp:
    image: nginx:alpine
    container_name: lentra-miniapp
    ports:
      - "8080:80"
    restart: unless-stopped
