services:

  redis:
    image: redis:7-alpine
    container_name: lentra-redis
    ports:
      - "6379:6379"

  db:
    image: postgres:15
    container_name: lentra-db
    environment:
      POSTGRES_USER: lentra
      POSTGRES_PASSWORD: lentra
      POSTGRES_DB: lentra
    ports:
      - "5432:5432"
    volumes:
      - lentra_pg:/var/lib/postgresql/data

  api:
    build: ../api
    container_name: lentra-api
    restart: always
    depends_on:
      - redis
      - db
    ports:
      - "8000:8000"

  worker:
    build: ../worker
    container_name: lentra-worker
    restart: always

  worker_stream:
    build: ../worker
    container_name: lentra-worker-stream
    restart: always
    command: ["python", "-u", "worker_stream.py"]

  bot:
    build: ../bot
    container_name: lentra-bot
    restart: always

  miniapp:
    build: ../miniapp
    container_name: lentra-miniapp
    restart: always
    ports:
      - "8080:80"

volumes:
  lentra_pg:
