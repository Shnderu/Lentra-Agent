version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: lentra-postgres
    restart: always
    environment:
      POSTGRES_USER: lentra
      POSTGRES_PASSWORD: lentra
      POSTGRES_DB: lentra
    ports:
      - "5432:5432"
    volumes:
      - lentra_pgdata:/var/lib/postgresql/data

volumes:
  lentra_pgdata:
