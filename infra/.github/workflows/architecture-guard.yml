name: Architecture Guard

on:
  pull_request:
  push:

jobs:
  guard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run architecture scan
        run: python3 scripts/repo_architecture_scan.py

