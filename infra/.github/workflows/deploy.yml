name: Lentra Production Deploy (v1-stable)

on:
  push:
    branches:
      - v1-stable

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            echo "[DEPLOY] starting on VPS"

            cd /opt/lentra/infra

            echo "[DEPLOY] pulling latest code"
            git fetch --all
            git reset --hard origin/v1-stable

            echo "[DEPLOY] restarting services"
            systemctl restart lentra-api
            systemctl restart lentra-bot

            echo "[DEPLOY] waiting for warmup"
            sleep 3

            echo "[DEPLOY] health check"
            curl -s http://localhost:8000/health || true

            echo "[DEPLOY] checking service status"
            systemctl is-active lentra-api
            systemctl is-active lentra-bot

            echo "[DEPLOY] SUCCESS"
