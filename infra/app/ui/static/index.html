<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Rent AI v9</title>
    <style>
        body { font-family: Arial; margin: 40px; background: #f5f5f5; }
        .container { max-width: 800px; margin: auto; }
        input { width: 70%; padding: 10px; }
        button { padding: 10px; }
        .card { background: white; padding: 15px; margin: 10px 0; border-radius: 8px; }
        .price { font-weight: bold; color: green; }
    </style>
</head>
<body>

<div class="container">
    <h2>Rent AI Search v9</h2>

    <input id="q" placeholder="rent apartment Bangkok 500">
    <button onclick="search()">Search</button>

    <div id="results"></div>
</div>

<script>
async function search() {
    const q = document.getElementById("q").value;

    const res = await fetch("http://localhost:8080/message", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: q })
    });

    const data = await res.json();

    const listings = data.result?.listings || [];

    let html = "";

    listings.forEach(l => {
        html += `
        <div class="card">
            <div><b>${l.title}</b></div>
            <div class="price">${l.price || "N/A"} USD</div>
            <div>${l.city || ""}</div>
            <div>${l.source}</div>
        </div>
        `;
    });

    document.getElementById("results").innerHTML = html;
}
</script>

</body>
</html>
