<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Rent AI v9.1</title>

    <style>
        body { font-family: Arial; margin: 40px; background: #f5f5f5; }
        .container { max-width: 800px; margin: auto; }

        input { width: 70%; padding: 10px; }
        button { padding: 10px; }

        .card {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
        }

        .price { font-weight: bold; color: green; }

        .status {
            margin-top: 20px;
            padding: 10px;
            border-radius: 6px;
        }

        .loading { background: #fff3cd; }
        .error { background: #f8d7da; }
        .empty { background: #e2e3e5; }
    </style>
</head>

<body>

<div class="container">
    <h2>Rent AI Search v9.1</h2>

    <input id="q" placeholder="rent apartment Bangkok 500">
    <button onclick="search()">Search</button>

    <div id="status"></div>
    <div id="results"></div>
</div>

<script>

function setStatus(type, text) {
    const el = document.getElementById("status");
    el.className = "status " + type;
    el.innerHTML = text;
}

function renderListings(listings) {
    let html = "";

    listings.forEach(l => {
        html += `
        <div class="card">
            <div><b>${l.title || "No title"}</b></div>
            <div class="price">${l.price ?? "N/A"} USD</div>
            <div>${l.city || ""}</div>
            <div>${l.source || ""}</div>
        </div>
        `;
    });

    document.getElementById("results").innerHTML = html;
}

async function search() {
    const q = document.getElementById("q").value;

    if (!q) {
        setStatus("error", "Введите запрос");
        return;
    }

    setStatus("loading", "Идёт поиск...");
    document.getElementById("results").innerHTML = "";

    try {
        const res = await fetch("http://localhost:8080/message", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: q })
        });

        if (!res.ok) {
            throw new Error("API error: " + res.status);
        }

        const data = await res.json();

        const listings = data?.result?.listings || [];

        if (!listings.length) {
            setStatus("empty", "Ничего не найдено");
            return;
        }

        setStatus("ok", "Найдено: " + listings.length);
        renderListings(listings);

    } catch (e) {
        setStatus("error", "Ошибка запроса: " + e.message);
    }
}

</script>

</body>
</html>
