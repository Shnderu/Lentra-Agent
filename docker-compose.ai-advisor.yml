version: "3.9"

services:
  ai-advisor:
    build:
      context: ..
      dockerfile: docker/ai-advisor.dockerfile
    container_name: lentra-ai-advisor
    restart: always
    environment:
      REDIS_HOST: lentra-redis
      REDIS_PORT: 6379
    networks:
      - infra_default

networks:
  infra_default:
    external: true
