services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: root-bot
    command: python /app/main.py
    restart: always
    depends_on:
      - redis
      - db
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: root-worker
    command: python core/engine/worker.py
    restart: always
    depends_on:
      - redis
      - db
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app

  redis:
    image: redis:7-alpine
    container_name: root-redis
    restart: always

  db:
    image: postgres:15
    container_name: root-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: root
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
