services:
  db:
    image: postgres:15
    container_name: flyrum-db
    restart: always
    environment:
      POSTGRES_DB: readme_to_recover
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init_tasks.sql:/docker-entrypoint-initdb.d/init_tasks.sql

  worker:
    build: .
    container_name: flyrum-worker
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: readme_to_recover
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: .
    container_name: flyrum-bot
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: readme_to_recover
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: flyrum-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:
