services:

  bot:
    container_name: flyrum-bot
    build: .
    command: python -u main.py
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: postgresql://flyrum:flyrum@flyrum-db:5432/flyrum
      REDIS_HOST: flyrum-redis
    depends_on:
      - flyrum-db
      - flyrum-redis

  worker:
    container_name: flyrum-worker
    build: .
    command: python -u worker_main.py
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: postgresql://flyrum:flyrum@flyrum-db:5432/flyrum
      REDIS_HOST: flyrum-redis
    depends_on:
      - flyrum-db
      - flyrum-redis

  flyrum-db:
    image: postgres:15
    container_name: flyrum-db
    environment:
      POSTGRES_USER: flyrum
      POSTGRES_PASSWORD: flyrum
      POSTGRES_DB: flyrum
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  flyrum-redis:
    image: redis:7-alpine
    container_name: flyrum-redis
    ports:
      - "6379:6379"

