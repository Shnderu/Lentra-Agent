services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: root-bot
    command: python bot/main.py
    restart: always
    depends_on:
      - redis
      - db
    environment:
      - PYTHONUNBUFFERED=1

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: root-worker
    command: python core/engine/worker.py
    restart: always
    depends_on:
      - redis
      - db
    environment:
      - PYTHONUNBUFFERED=1

  redis:
    image: redis:7-alpine
    container_name: root-redis
    restart: always
    ports:
      - "6379:6379"

  db:
    image: postgres:15
    container_name: root-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: root
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
