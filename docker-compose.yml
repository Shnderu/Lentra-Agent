services:
  db:
    image: postgres:15
    container_name: flyrum-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - flyrum_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: flyrum-redis
    restart: always
    ports:
      - "6379:6379"

  worker:
    build: .
    container_name: flyrum-worker
    restart: always
    env_file:
      - .env
    command: ["python", "-u", "/app/main.py"]
    depends_on:
      - db
      - redis

volumes:
  flyrum_db_data:
