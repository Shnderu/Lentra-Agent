services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: root-bot
    command: python bot/main.py
    restart: always
    depends_on:
      - redis
      - db
    env_file:
      - .env

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: root-worker
    command: python core/engine/worker.py
    restart: always
    depends_on:
      - redis
      - db
    env_file:
      - .env

  redis:
    image: redis:7-alpine
    container_name: root-redis
    restart: always

  db:
    image: postgres:15
    container_name: root-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: root
